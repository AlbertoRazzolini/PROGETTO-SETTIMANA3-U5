<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salone Auto</title>
    <script>
      // Applica il tema salvato (o quello di sistema) prima del primo render; la chiave e' la stessa di src/tema/tema.ts
      try {
        var t = localStorage.getItem('salone.tema')
        if (t === 'scuro' || (t !== 'chiaro' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
