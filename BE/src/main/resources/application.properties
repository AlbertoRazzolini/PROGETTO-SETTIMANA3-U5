spring.application.name=BE

# --- Database (Postgres) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db-PS3U5}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Email (Gmail SMTP) ---
# MAIL_USERNAME e MAIL_PASSWORD (password per le app di Gmail) arrivano SOLO da variabili d'ambiente:
# la password di Gmail non entra nella repository.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.mittente=${MAIL_FROM:alberto.razzolini@gmail.com}

# --- JWT ---
# Secret lasciato in chiaro come default volutamente: progetto didattico,
# cosi' chi clona il repo (es. per la correzione) puo' avviarlo senza dover
# configurare variabili d'ambiente. In un progetto reale andrebbe SOLO in
# una variabile d'ambiente, mai committato.
app.jwt.secret=${JWT_SECRET:UflahZjoJuYfrd3Tl6OEGGyiIophMJIbRe1tbuDty7B830VwfU}
# 1 settimana, comoda per la correzione senza dover rifare il login
app.jwt.expiration=${JWT_EXPIRATION:604800000}

# --- CORS (frontend Vite/React) ---
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
# URL del frontend, usato per i link nelle mail
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# URL pubblico del backend, usato per il link di disattivazione avviso nelle mail
app.backend-url=${BACKEND_URL:http://localhost:8080}

# --- auto.dev ---
# API key SOLO da variabile d'ambiente (mai committata).
app.autodev.base-url=https://api.auto.dev
app.autodev.api-key=${AUTODEV_API_KEY:}
# Risultati per pagina della ricerca generica: 20 e' il massimo del piano Free (una chiamata per pagina)
app.autodev.limit-default=20

# --- Traduzione (MyMemory, gratuita, senza chiave) ---
app.traduzione.base-url=https://api.mymemory.translated.net

# --- Cambio valuta ---
# Tasso fisso USD -> EUR: scelta didattica, evita una dipendenza da un'API esterna in piu'.
# Valore realistico (media 2025/2026 circa 0.86-0.93).
app.cambio.usd-eur=0.92

# --- Seeder utenti (user, admin, super-admin) ---
# Password di default in chiaro volutamente (come il JWT secret) per permettere il login
# immediato a chi corregge; vengono salvate nel DB solo come hash BCrypt.
# Email di default sul dominio riservato example.com (RFC 2606): le mail di avviso prezzo
# non arrivano mai a persone reali. Per riceverle davvero impostare SEED_*_EMAIL con un
# proprio indirizzo (vale alla creazione dell'utente, cioe' al primo avvio con DB vuoto).
app.seed.user.email=${SEED_USER_EMAIL:user@example.com}
app.seed.user.password=${SEED_USER_PASSWORD:User1234!}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@example.com}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin1234!}
app.seed.superadmin.email=${SEED_SUPERADMIN_EMAIL:superadmin@example.com}
app.seed.superadmin.password=${SEED_SUPERADMIN_PASSWORD:SuperAdmin1234!}

logging.level.com.example.be=INFO
