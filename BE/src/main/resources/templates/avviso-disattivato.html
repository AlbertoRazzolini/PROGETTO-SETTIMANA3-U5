<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avviso di prezzo</title>
    <style>
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #1f2933; }
        .box { max-width: 480px; margin: 64px auto; background: #fff; border-radius: 8px; padding: 32px; text-align: center; }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { line-height: 1.5; color: #52606d; }
        a { display: inline-block; margin-top: 16px; background: #1f3a5f; color: #fff; text-decoration: none;
            padding: 10px 20px; border-radius: 6px; }
    </style>
</head>
<body>
<div class="box">
    <th:block th:if="${ok}">
        <h1>Avviso disattivato</h1>
        <p>Non riceverai pi&ugrave; email per questa auto. Puoi riattivarlo quando vuoi impostando una nuova soglia dal tuo profilo.</p>
    </th:block>
    <th:block th:unless="${ok}">
        <h1>Link non valido</h1>
        <p>Il link &egrave; scaduto, &egrave; gi&agrave; stato usato oppure non &egrave; corretto.</p>
    </th:block>
    <a th:href="${frontendUrl}" href="#">Torna al salone</a>
</div>
</body>
</html>
